# Descreve o serviço Docker e as variáveis necessárias para publicar o Findy pelo Blueprint do Render.

# No Render: New > Blueprint > conectar este repositorio.
services:
  - type: web
    name: findy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /index.html
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "10000"
      - key: JDBC_DATABASE_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false

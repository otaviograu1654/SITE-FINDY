spring.application.name=plataformaservicos

# Variaveis de ambiente definidas no terminal/IDE antes de iniciar o Java.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:findy}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

# As tabelas serao criadas por migrations na proxima etapa.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Configura o backend, a conexão local ao PostgreSQL e as variáveis de recuperação de senha.

spring.application.name=plataformaservicos
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Variaveis de ambiente definidas no terminal/IDE antes de iniciar o Java.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:findy}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

# As tabelas sao criadas pelos arquivos SQL da pasta database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Recuperacao de senha e envio de e-mail.
findy.brevo.api-key=${BREVO_API_KEY:}
findy.email.remetente=${EMAIL_FROM:}
findy.app-url=${APP_URL:http://localhost:8080}

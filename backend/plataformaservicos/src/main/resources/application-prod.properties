# Configura a conexão ao banco online e os cookies seguros para a aplicação hospedada.

# Ativado no Docker/Render. Credenciais ficam nas variaveis da hospedagem.
# Exemplo: jdbc:postgresql://HOST:5432/neondb?sslmode=require
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# O Render recebe HTTPS e encaminha a requisicao ao container.
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

<!DOCTYPE html>
<!-- Apresenta a busca e a lista de serviços da categoria escolhida. -->

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findy - Categorias</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="images/findy-logo.png">
  <link rel="stylesheet" href="style.css?v=20261116-3">
  <link rel="stylesheet" href="cabecalho.css">
  <script src="api.js" defer></script>
  <script src="cabecalho.js" defer></script>
</head>
<body>
  <header id="cabecalho-findy"><a href="index.html">Findy — Início</a></header>

  <!-- ===================== BARRA DE NAVEGAÇÃO ===================== -->


  <!-- ===================== RESULTADOS DA CATEGORIA ===================== -->
  <main class="category-results">
    <h1 class="category-results__title">Principais da categoria</h1>

    <!-- categoria.js consulta a API; aparecem apenas serviços ativos de
         profissionais aprovados. Os exemplos do PI ficam identificados. -->
    <div class="professional-grid" id="professional-grid">
      <noscript>Ative o JavaScript para ver os profissionais desta categoria.</noscript>
    </div>

    <nav class="pagination" aria-label="Paginação de resultados"></nav>
  </main>

  <!-- ===================== WIDGET DE CHAT (CANTO INFERIOR) ===================== -->
  <div class="chat-widget">
    <p class="chat-widget__bubble">Dúvidas? Fale com o Fido!</p>

    <!-- role="button" + tabindex="0" avisam leitores de tela e permitem
         navegar até aqui pelo teclado (Tab), já que uma <img> sozinha
         não é focável nem clicável por padrão como um <button> seria -->
    <img
      src="images/chat-avatar.png"
      alt="Abrir chat com Fido, assistente virtual da Findy"
      class="chat-widget__avatar"
      id="chat-avatar"
      role="button"
      tabindex="0"
      aria-haspopup="dialog"
      aria-expanded="false"
      aria-controls="chat-panel"
    >

    <!-- A janela de chat em si. Começa escondida ("hidden") e só abre
         quando o avatar acima é clicado. -->
    <div class="chat-panel" id="chat-panel" role="dialog" aria-label="Chat com Fido" hidden>
      <header class="chat-panel__header">
        <img src="images/chat-avatar.png" alt="" class="chat-panel__header-avatar" aria-hidden="true">
        <div class="chat-panel__header-text">
          <p class="chat-panel__title">Fido</p>
          <p class="chat-panel__subtitle">Assistente virtual da Findy</p>
        </div>
        <button type="button" class="chat-panel__close" id="chat-panel-close" aria-label="Fechar chat">&times;</button>
      </header>

      <!-- Aqui é onde as mensagens (perguntas + respostas) vão se
           acumulando conforme a conversa acontece -->
      <div class="chat-panel__messages" id="chat-panel-messages">
        <p class="chat-message chat-message--bot">
          Oi! Eu sou o Fido 🦫 Escolha uma das perguntas abaixo:
        </p>
      </div>

      <!-- O roteiro fixo: cada botão já carrega sua própria resposta em
           "data-resposta". Pra adicionar uma pergunta nova ao FAQ, basta
           copiar um desses botões e trocar o texto e o data-resposta —
           não precisa mexer no JavaScript. -->
      <div class="chat-panel__quick-replies" id="chat-panel-quick-replies">
        <button type="button" class="chat-quick-reply" data-resposta="Na página de login, use o formulário Cadastre-se agora: informe nome, e-mail e senha. Depois, entre com seu e-mail e senha. A mesma conta permite contratar e oferecer serviços.">
          Como funciona o cadastro?
        </button>
        <button type="button" class="chat-quick-reply" data-resposta="Nesta versão, criar conta, buscar profissionais, cadastrar serviços e enviar pedidos é gratuito. O serviço prestado pode ter custo: cliente e prestador combinam o valor e o pagamento diretamente. A Findy não processa pagamentos.">
          A Findy é gratuita?
        </button>
        <button type="button" class="chat-quick-reply" data-resposta="Escolha uma categoria ou use a busca. Os resultados mostram profissionais aprovados e com serviços ativos. Os perfis fictícios do PI aparecem como demonstração.">
          Como encontro um profissional?
        </button>
        <button type="button" class="chat-quick-reply" data-resposta="Entre na sua conta, abra Perfil profissional, preencha o cadastro e envie para análise. Em Meus serviços, cadastre uma oferta ativa na categoria desejada. Você aparece na busca quando conta e perfil estão ativos e o perfil está aprovado. Marcar habilidades não cria serviços automaticamente.">
          Sou autônomo, como apareço nas buscas?
        </button>
        <button type="button" class="chat-quick-reply" data-resposta="Na página de login, clique em Esqueceu a senha? e informe o e-mail da sua conta. Se ele estiver cadastrado, você receberá um link para definir uma nova senha. Confira também o spam. O link vale por 30 minutos e pode ser usado uma única vez; se expirar, solicite outro.">
          Esqueci minha senha, e agora?
        </button>
        <button type="button" class="chat-quick-reply" data-resposta="Abra Perfil profissional e use Dados pessoais da conta para mudar nome, telefone, localização ou foto. Salvar nesse formulário não reenvia o perfil para análise. Enviar o cadastro profissional para análise exige nova aprovação, mesmo que já estivesse aprovado.">
          Onde altero meus dados?
        </button>
        <button type="button" class="chat-quick-reply" data-resposta="Em Minha conta, veja os pedidos recentes. Para atender clientes, abra Meus pedidos e escolha Recebidos como prestador. Clique em Ver pedido e responder para consultar os detalhes e aceitar ou recusar. Use Atualizar lista para conferir novos pedidos.">
          Onde vejo pedidos dos clientes?
        </button>
        <button type="button" class="chat-quick-reply" data-resposta="Os campos de telefone não aparecem no perfil público. Telefones e endereço completo só são liberados nos detalhes do pedido, aos dois participantes, depois do aceite do prestador. Não coloque contatos ou endereço completo nos textos públicos ou na descrição do pedido.">
          Quem pode ver meu telefone?
        </button>
        <button type="button" class="chat-quick-reply" data-resposta="Ainda não há chat entre cliente e prestador. Você pode enviar uma mensagem inicial no pedido. Após o aceite, os telefones ficam disponíveis para ligação ou WhatsApp, se o número tiver WhatsApp. O Fido responde apenas perguntas frequentes.">
          Posso conversar pelo site?
        </button>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
  <script src="categoria.js" defer></script>
</body>
</html>

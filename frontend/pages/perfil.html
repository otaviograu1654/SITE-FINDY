<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findy - Perfil</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== CABEÇALHO (fundo claro, igual ao da Home) ===================== -->
  <header class="profile-nav">
    <a href="index.html" class="logo">
      <img src="images/findy-logo.png" alt="Findy" class="logo__image">
    </a>

    <span class="profile-nav__label">Perfil</span>

    <form class="search-form profile-nav__search" role="search">
      <input type="text" class="search-form__input" placeholder="Busque no Perfil do Findy">
      <button type="submit" class="search-form__button" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2"/>
          <line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <!-- O comportamento desse botão não estava especificado no protótipo,
         então deixei ele só visual por enquanto (sem funcionalidade) -->
    <button type="button" class="icon-button" aria-label="Informações">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/>
        <line x1="12" y1="11" x2="12" y2="16.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="7.5" r="1.1" fill="white"/>
      </svg>
    </button>

    <a href="perfil.html" class="profile-nav__avatar-link" aria-label="Ir para o perfil">
      <img src="images/jose-leandro.jpg" alt="Foto de perfil de José Leandro" class="profile-nav__avatar">
    </a>
  </header>

  <!-- ===================== CONTEÚDO DO PERFIL ===================== -->
  <main class="profile-layout">

    <!-- Menu lateral: por enquanto os links não levam a lugar nenhum,
         porque as páginas de "Login e senha", "Serviços Prestados" etc.
         ainda não existem neste projeto. -->
    <nav class="profile-sidebar" aria-label="Configurações do perfil">
      <a href="#" class="profile-sidebar__item">Dados pessoais</a>
      <a href="#" class="profile-sidebar__item">Login e senha</a>
      <a href="#" class="profile-sidebar__item">Serviços Prestados</a>
      <a href="#" class="profile-sidebar__item">Lista de bloqueios</a>
      <button type="button" class="profile-sidebar__item profile-sidebar__item--danger" id="excluir-conta">
        Excluir conta
      </button>
    </nav>

    <!-- Dados pessoais: foto (editável) + campos de informação -->
    <section class="profile-details">
      <div class="profile-photo-wrap">
        <img src="images/jose-leandro.jpg" alt="Foto de perfil de José Leandro" class="profile-photo" id="profile-photo">

        <!-- Ícone de lápis: ao clicar, abre o seletor de arquivo escondido
             logo abaixo. O <input type="file"> nunca aparece na tela — só
             existe pra abrir a janela do sistema operacional de escolher
             um arquivo. -->
        <button type="button" class="profile-photo__edit" id="editar-foto" aria-label="Trocar foto de perfil">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M4 20l1-4.2L15.6 5.2a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19 4 20Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>
        <input type="file" accept="image/*" id="input-foto-perfil" hidden>
      </div>

      <div class="profile-fields">
        <div class="profile-field">
          <span class="profile-field__label">Nome:</span>
          <span class="profile-field__value">José Leandro</span>
        </div>
        <div class="profile-field">
          <span class="profile-field__label">Gênero:</span>
          <span class="profile-field__value">Masculino</span>
        </div>
        <div class="profile-field">
          <span class="profile-field__label">Email:</span>
          <span class="profile-field__value">joseleandr909@outlook.com</span>
        </div>
        <div class="profile-field">
          <span class="profile-field__label">Telefone:</span>
          <span class="profile-field__value">+5599999999</span>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js" defer></script>
</body>
</html>

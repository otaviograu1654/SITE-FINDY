<!DOCTYPE html>
<!-- Apresenta o painel de administração e análise dos cadastros. -->

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Findy - Administração</title>
  <link rel="icon" type="image/x-icon" href="images/findy-logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="perfil.css">
  <link rel="stylesheet" href="cabecalho.css">
  <script src="api.js" defer></script>
  <script src="cabecalho.js" defer></script>
</head>
<body class="perfil-contratante">
  <header id="cabecalho-findy"><a href="index.html">Findy — Início</a></header>
<div class="wrap">


  <main>
    <h1>Administração</h1>
    <p id="admin-mensagem" class="mensagem"
       role="status" aria-live="polite">Carregando…</p>

    <label>
      Filtrar perfis profissionais
      <select id="admin-filtro">
        <option value="">Todos os cadastros</option>
        <option value="PENDENTE">Pendentes</option>
        <option value="APROVADO">Aprovados</option>
        <option value="CORRECAO_SOLICITADA">Correção solicitada</option>
        <option value="RECUSADO_DEFINITIVO">Recusados definitivamente</option>
        <option value="RECUSADO">Recusas anteriores</option>
      </select>
    </label>

    <div id="admin-lista"></div>
  </main>
</div>
<script src="conta.js" defer></script>
<script src="admin.js" defer></script>
</body>
</html>

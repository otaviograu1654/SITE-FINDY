<!DOCTYPE html>
<!-- Apresenta os formulários de login e cadastro e o acesso à recuperação de senha. -->

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findy - Login e Cadastro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="images/findy-logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== SEÇÃO 1: FAIXA DE LOGIN (RODAPÉ AZUL) ===================== -->
  <section class="login-bar">
    <!-- O logo agora é um link: clicar nele volta para a página de serviços -->
    <a href="index.html" class="logo logo--on-blue">
      <img src="images/findy-logo.png" alt="Findy" class="logo__image">
    </a>

    <form class="login-form" id="login-form">
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" placeholder="Insira seu email" required maxlength="100" autocomplete="username">
      </div>

      <div class="field">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" placeholder="Insira sua senha" required maxlength="72" autocomplete="current-password">
        <a href="recuperar-senha.html" class="field__link">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn btn--dark">Login</button>
      <p id="login-mensagem" role="status" aria-live="polite" hidden></p>
    </form>
  </section>

  <!-- ===================== SEÇÃO 2: CADASTRO ===================== -->
  <section class="signup">
    <div class="signup__mascote" aria-hidden="true">
      <img src="images/beaver-mascot.png" alt="Mascote Findy, um castor azul" class="signup__mascote-image">
    </div>

    <div class="signup__form-wrap">
      <h2 class="signup__title">Cadastre-se agora!</h2>
      <p class="signup__subtitle">Gratuitamente</p>

      <form class="signup-form" id="signup-form">
        <input type="text" id="signup-nome" placeholder="Nome completo" aria-label="Nome completo" required maxlength="100" autocomplete="name">
        <input type="email" id="signup-email" placeholder="E-mail" aria-label="E-mail de cadastro" required maxlength="100" autocomplete="email">

        <div class="password-field">
          <div class="password-input-wrap">
            <input
              type="password"
              id="signup-senha"
              class="password-input"
              placeholder="Crie uma senha"
              required
              minlength="8"
              maxlength="72"
              autocomplete="new-password"
              aria-label="Crie uma senha"
            >
            <span class="password-status" id="password-status">
              <span class="password-status__icon" id="password-status-icon"></span>
              <span class="password-status__text" id="password-status-text"></span>
            </span>
          </div>
        </div>

        <p>Uma conta para contratar e oferecer serviços. Ative seu perfil profissional depois de entrar.</p>
        <button type="submit" class="btn btn--dark btn--full">Cadastrar</button>
        <p id="signup-mensagem" role="status" aria-live="polite" hidden></p>
      </form>
    </div>
  </section>

  <script src="script.js"></script>
  <script src="api.js"></script>
  <script src="conta.js"></script>
</body>
</html>

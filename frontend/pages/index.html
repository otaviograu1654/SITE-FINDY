<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findy - Encontre seu melhor serviço</title>

  <!-- Fonte do Google Fonts: um sans-serif redondo e bem "gordinho", parecido com o do protótipo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== SEÇÃO 1: TOPO + GRADE DE SERVIÇOS ===================== -->
  <section class="hero-grid">

    <!-- Bloco do cabeçalho: fica na 1ª célula da grade (linha 1, coluna 1) -->
    <div class="brand-block">
      <div class="logo">
        <img src="images/findy-logo.png" alt="Findy" class="logo__image">
      </div>
      <p class="brand-block__tagline">Encontre seu melhor serviço</p>
      <a href="login.html" class="btn btn--dark">Login</a>
    </div>

    <!-- As 7 categorias de serviço. A ordem no HTML é o que decide a posição na grade. -->
    <a href="imagens/card-servicos-domesticos.jpg" class="card card--dom card--photo-dom">
      <h2 class="card__title">Serviços<br>Domésticos</h2>
      <span class="card__arrow" aria-hidden="true">&rarr;</span>
    </a>

    <a href="categoria.html?categoria=Eventos" class="card card--blue card--photo-evt">
      <h2 class="card__title">Eventos</h2>
      <span class="card__arrow" aria-hidden="true">&rarr;</span>
    </a>

    <a href="categoria.html?categoria=Infantil" class="card card--dark card--photo-inf">
      <h2 class="card__title">Infantil</h2>
      <span class="card__arrow" aria-hidden="true">&rarr;</span>
    </a>

    <a href="categoria.html?categoria=Servi%C3%A7os%20Gerais" class="card card--blue card--tall card--photo-ger">
      <h2 class="card__title">Serviços<br>Gerais</h2>
      <span class="card__arrow" aria-hidden="true">&rarr;</span>
    </a>

    <a href="categoria.html?categoria=Constru%C3%A7%C3%A3o%20Civil" class="card card--red card--photo-con">
      <h2 class="card__title">Construção<br>Civil</h2>
      <span class="card__arrow" aria-hidden="true">&rarr;</span>
    </a>

    <a href="categoria.html?categoria=Marketing%20e%20Vendas" class="card card--dark card--photo-mkt">
      <h2 class="card__title">Marketing<br>e Vendas</h2>
      <span class="card__arrow" aria-hidden="true">&rarr;</span>
    </a>

    <a href="categoria.html" class="card card--red card--photo-tec">
      <h2 class="card__title">Tecnologia<br>e Design</h2>
      <span class="card__arrow" aria-hidden="true">&rarr;</span>
    </a>

  </section>

</body>
</html>

<!DOCTYPE html>
<!-- Consulta o pedido real e permite aceitar, recusar ou cancelar conforme a conta. -->

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findy - Status do atendimento</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="images/findy-logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pedidos.css">
  <link rel="stylesheet" href="cabecalho.css">
  <script src="api.js" defer></script>
  <script src="cabecalho.js" defer></script>
</head>
<body>
  <header id="cabecalho-findy"><a href="index.html">Findy — Início</a></header>

  <!-- ===================== BARRA DE NAVEGAÇÃO (mesma de categoria.html) ===================== -->


  <!-- ===================== PÁGINA DE STATUS DO ATENDIMENTO ===================== -->
  <main class="hire-page status-page">
    <a href="meus-pedidos.html" class="hire-page__back">&larr; Meus pedidos</a>
    <h1 class="hire-page__title" id="status-titulo">Acompanhar pedido</h1>
    <button type="button" class="btn btn--dark" id="status-atualizar">Atualizar pedido</button>
    <p id="status-mensagem" class="pedido-mensagem" role="status" aria-live="polite">Carregando pedido…</p>
    <section id="status-conteudo" class="pedido-painel" hidden>
      <h2 id="status-badge" class="status-badge"></h2>
      <p id="status-aviso" class="pedido-aviso"></p>
      <dl id="status-detalhes" class="pedido-detalhes"></dl>
      <p>Os valores são uma referência, sem cobrança pela Findy. Combinem o valor final diretamente.</p>
      <div class="pedido-acoes">
        <button type="button" class="btn btn--dark" data-acao="ACEITAR" hidden>Aceitar pedido</button>
        <button type="button" class="btn hire-btn-outline" data-acao="RECUSAR" hidden>Recusar pedido</button>
        <button type="button" class="btn hire-btn-outline" data-acao="CANCELAR" hidden>Cancelar pedido</button>
      </div>
    </section>
  </main>
  <script src="script.js" defer></script>
  <script src="pedidos-comum.js" defer></script><script src="atendimento.js" defer></script>
</body>
</html>
